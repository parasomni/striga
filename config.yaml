framework:
  name: striga attack framework
  version: 1.2.0
  location: /etc/striga
  logging_dir: logs
  logging_file: framework.log
  config_path: config.yaml
  vuln_cache: vuln_results.json
  services_list: /opt/striga/evaluation/services.json
  debug: false
  timeout: 300
exploit_launcher:
  MSF_PASSWORD: akVcNV3j
  MSF_SERVER: 127.0.0.1
  MSF_PORT: 55552
  LHOST: 10.10.14.218
  LPORT: '4444'
  CHOST: 10.10.14.218
  CPORT: '4444'
  CVE_DATABASE: cve_mappings.json
  VULNERS_API_FILE: vulners_api.key
  MITRE_API_URL: https://cveawg.mitre.org/api/cve/
  VULNERS_API_URL: https://vulners.com/api/v3/search/lucene/
web_tech_lookup:
  enabled: true
  vulners_software_url: https://vulners.com/api/v3/burp/software/
  nvd_api_url: https://services.nvd.nist.gov/rest/json/cves/2.0
  # Override if `httpx` on PATH resolves to the unrelated Python httpx HTTP
  # client's CLI (pip install httpx[cli]) instead of ProjectDiscovery's recon
  # tool -- point this at the correct binary's full path, e.g. ~/go/bin/httpx.
  httpx_binary: httpx
github_exploit_search:
  enabled: true
  poc_index_url: https://raw.githubusercontent.com/nomi-sec/PoC-in-GitHub/master
  max_candidates: 5
  min_stars: 0
  exclude_discovery_scripts: true
sandbox:
  enabled: true
  strict_egress: true
  cpu_limit: '0.5'
  memory_limit: 256m
  pids_limit: 64
  timeout: 120
  images:
    py: striga-sandbox-python:3.12
    sh: bash:5
    pl: perl:slim
    rb: ruby:3-alpine
    php: php:8-cli-alpine
performance:
  use_cache: true
scanner:
  nmap:
    enabled: true
    flags:
    - -sV
    - -p-
    - --min-rate=1000
  nmap-http:
    enabled: false
    flags:
    - -sV
    - --script
    - http-enum
    - -Pn
  nmap-vuln:
    enabled: true
    flags:
    - -sV
    - --script
    - vuln
    - -Pn
    - -oX
    - '-'
  nuclei:
    enabled: true
    flags:
    - -jsonl
  nikto:
    enabled: false
    flags:
    - ''
  enum4linux:
    enabled: true
    flags:
    - -a
  ffuf:
    enabled: true
    flags:
    - -w
    - /usr/share/seclists/Discovery/DNS/subdomains-top1million-20000.txt
  gobuster:
    enabled: true
    flags:
    - dir
    - -x
    - html,php,js
    - -w
    - /usr/share/seclists/Discovery/Web-Content/common.txt
  dirbuster:
    enabled: false
    flags:
    - ''
  whatweb:
    enabled: true
    flags:
    - ' '
  smbclient:
    enabled: false
    flags:
    - -L
    - -N
  snmpbulkwalk:
    enabled: true
    flags:
    - ' '
  dnsenum:
    enabled: true
    flags:
    - ' '
  nslookup:
    enabled: true
    flags:
    - ' '
  whois:
    enabled: true
    flags:
    - ' '
  sqlmap:
    enabled: false
    flags:
    - ' '
  ldapsearch:
    enabled: false
    flags:
    - ' '
  rustscan:
    enabled: false
    flags:
    - --ulimit
    - 5000
    - -b
    - 2500
    - --
    - -sC
    - -sV
    - -Pn


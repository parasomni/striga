framework:
  name: striga attack framework
  version: 1.3.0
  location: /etc/striga
  logging_dir: logs
  logging_file: framework.log
  config_path: config.yaml
  vuln_cache: vuln_results.json
  services_list: /opt/striga/evaluation/services.json
  debug: false
  timeout: 300
exploit_launcher:
  MSF_PASSWORD: akVcNV3j
  MSF_SERVER: 127.0.0.1
  MSF_PORT: 55552
  LHOST: 10.10.14.218
  LPORT: '4444'
  CHOST: 10.10.14.218
  CPORT: '4444'
  CVE_DATABASE: cve_mappings.json
  VULNERS_API_FILE: vulners_api.key
  MITRE_API_URL: https://cveawg.mitre.org/api/cve/
  VULNERS_API_URL: https://vulners.com/api/v3/search/lucene/
web_tech_lookup:
  enabled: true
  vulners_software_url: https://vulners.com/api/v3/burp/software/
  nvd_api_url: https://services.nvd.nist.gov/rest/json/cves/2.0
  # Override if `httpx` on PATH resolves to the unrelated Python httpx HTTP
  # client's CLI (pip install httpx[cli]) instead of ProjectDiscovery's recon
  # tool -- point this at the correct binary's full path, e.g. ~/go/bin/httpx.
  httpx_binary: httpx
github_exploit_search:
  enabled: true
  poc_index_url: https://raw.githubusercontent.com/nomi-sec/PoC-in-GitHub/master
  max_candidates: 5
  min_stars: 0
  exclude_discovery_scripts: true
sandbox:
  enabled: true
  strict_egress: true
  cpu_limit: '0.5'
  memory_limit: 256m
  pids_limit: 64
  timeout: 120
  images:
    py: striga-sandbox-python:3.12
    sh: bash:5
    pl: perl:slim
    rb: ruby:3-alpine
    php: php:8-cli-alpine
performance:
  use_cache: true
  # Max enumeration/scan subprocesses running at once across the whole run (all
  # targets/ports/tools). Bounds fan-out so parallelism speeds things up instead
  # of thrashing the host and tripping target-side rate limiting.
  max_concurrency: 24
  # Two-phase nmap: a fast port-discovery sweep (no -sV) followed by service/
  # version detection on only the open ports, instead of running -sV across all
  # 65535 ports. This is the single biggest scan-time reducer. Set false to fall
  # back to the old single-command scan using scanner.nmap.flags verbatim.
  two_phase_scan: true
  discovery_min_rate: 2000
  # Run ssl-cert + http-title NSE in the (port-scoped) service phase so the scan
  # reveals TLS cert names and HTTP redirect hostnames -- these become vhost
  # targets for web enum. Cheap because it only touches already-open ports.
  hostname_scripts: true
web_enum:
  # Route web-enum tools at the virtual host discovered in the scan (via Host
  # header / TLS SNI, no /etc/hosts changes). Set false to always use the bare
  # target address.
  use_vhost: true

llm:
  enabled: true              
  provider: ollama
  model: qwen2.5:14b-instruct
  base_url: http://127.0.0.1:11434
  # If the ollama backend isn't reachable when AI evaluation is about to run,
  # start `ollama serve` in the background first (ollama provider only; requires
  # the ollama binary on PATH). Set false to never auto-start it.
  autostart: true
  max_input_chars: 12000      
  chunk_overlap_chars: 400
  review_min_confidence: 0.5 
  review_max_fp: 0.5          
  drop_below_confidence: null 
  output_format: markdown

scanner:
  nmap:
    enabled: true
    flags:
    - -sV
    - -p-
    - --min-rate=1000
    - -Pn
    - -T4
  nmap-http:
    enabled: false
    flags:
    - -sV
    - --script
    - http-enum
    - -Pn
  nmap-vuln:
    enabled: true
    flags:
    - -sV
    - --script
    - vuln
    - -Pn
    - -oX
    - '-'
  nuclei:
    enabled: true
    flags:
    - -jsonl
    # Skip info-level noise and cap request rate so nuclei stays fast and doesn't
    # hammer the target -- the findings/resources trade-off tuned toward signal.
    - -severity
    - low,medium,high,critical
    - -rate-limit
    - '150'
    - -timeout
    - '8'
  nikto:
    enabled: false
    flags:
    - ''
  enum4linux:
    enabled: true
    flags:
    - -a
  ffuf:
    enabled: true
    flags:
    - -w
    - /usr/share/seclists/Discovery/DNS/subdomains-top1million-20000.txt
  gobuster:
    enabled: true
    flags:
    - dir
    - -x
    - html,php,js
    - -w
    - /usr/share/seclists/Discovery/Web-Content/common.txt
  dirbuster:
    enabled: false
    flags:
    - ''
  feroxbuster:
    enabled: false
    flags:
    # Fast Rust content discovery. Bounded depth + scan-limit keep recursion from
    # exploding; -k tolerates lab self-signed TLS. Enable in place of gobuster
    # when you want recursion without the runtime blow-up.
    - -w
    - /usr/share/seclists/Discovery/Web-Content/common.txt
    - -x
    - html,php,js
    - -t
    - '40'
    - --depth
    - '2'
    - --scan-limit
    - '2'
    - -k
    - --silent
    - --no-state
  sslscan:
    enabled: true
    flags:
    - --no-colour
  wpscan:
    enabled: true
    # Vulnerable plugins/themes + user enum only (not the full aggressive set) and
    # passive plugin detection -- targeted, so a WP host gets a real audit without
    # a long brute-force. Self-gated: only runs where WordPress was fingerprinted.
    api_token_file: wpscan_api.key
    flags:
    - --no-banner
    - --random-user-agent
    - --plugins-detection
    - passive
    - -e
    - vp,vt,u
  vhostfuzz:
    enabled: true
    # Runs the ffuf binary to fuzz Host: FUZZ.<domain>. -ac auto-calibrates against
    # the default vhost so only genuinely different vhosts are reported; a 5k list
    # keeps it fast. Only fires when a base domain is known (discovered vhost or a
    # hostname target).
    flags:
    - -w
    - /usr/share/seclists/Discovery/DNS/subdomains-top1million-5000.txt
    - -ac
  smbmap:
    enabled: true
    flags: []
  whatweb:
    enabled: true
    flags:
    - ' '
  smbclient:
    enabled: false
    flags:
    - -L
    - -N
  snmpbulkwalk:
    enabled: true
    flags:
    - ' '
  dnsenum:
    enabled: true
    flags:
    - ' '
  nslookup:
    enabled: true
    flags:
    - ' '
  whois:
    enabled: true
    flags:
    - ' '
  sqlmap:
    enabled: false
    flags:
    - ' '
  ldapsearch:
    enabled: false
    flags:
    - ' '
  rustscan:
    enabled: false
    flags:
    - --ulimit
    - 5000
    - -b
    - 2500
    - --
    - -sC
    - -sV
    - -Pn

